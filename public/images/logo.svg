<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="100%" height="100%">
  <defs>
    <!-- Degradados principales del logotipo -->
    <linearGradient id="gradCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22e1ff" />
      <stop offset="50%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#002b80" />
    </linearGradient>

    <linearGradient id="gradTopS" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38f2ff" />
      <stop offset="45%" stop-color="#0095ff" />
      <stop offset="100%" stop-color="#0039a6" />
    </linearGradient>

    <linearGradient id="gradDarkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0044b3" />
      <stop offset="100%" stop-color="#00164d" />
    </linearGradient>

    <linearGradient id="gradLaptop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a6c" />
      <stop offset="100%" stop-color="#0b1933" />
    </linearGradient>

    <linearGradient id="gradCircuit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0055cc" />
    </linearGradient>
  </defs>

  <!-- 1. Silueta de Laptop (Fondo) -->
  <g id="laptop-icon">
    <!-- Pantalla exterior -->
    <path d="M 215 95 L 385 90 C 392 90 396 94 397 101 L 410 215 C 411 221 407 224 401 224 L 355 224 L 363 213 L 395 213 L 384 103 L 222 107 Z" fill="url(#gradLaptop)" />
    <!-- Base de la laptop -->
    <path d="M 332 230 L 458 230 C 462 230 460 237 450 241 C 443 244 434 245 422 245 L 305 245 Z" fill="url(#gradLaptop)" />
    <path d="M 342 234 L 446 234 L 442 237 L 338 237 Z" fill="#4da6ff" opacity="0.5" />
  </g>

  <!-- 2. Líneas de Circuito (Izquierda) -->
  <g id="circuits" stroke="url(#gradCircuit)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Línea superior -->
    <circle cx="56" cy="112" r="6" fill="#ffffff" stroke-width="4.5" />
    <polyline points="63,112 105,112 136,143 156,143" />
    
    <!-- Línea central -->
    <circle cx="17" cy="136" r="7" fill="#ffffff" stroke-width="5" />
    <polyline points="25,136 82,136 113,164 164,164" />
    
    <!-- Línea inferior -->
    <circle cx="46" cy="158" r="6" fill="#ffffff" stroke-width="4.5" />
    <polyline points="53,158 75,158 102,182 145,182" />
  </g>

  <!-- 3. Píxeles Digitales (Derecha) -->
  <g id="pixels">
    <rect x="458" y="88" width="20" height="20" rx="2" fill="#0095ff" />
    <rect x="436" y="106" width="18" height="18" rx="2" fill="#0077e6" />
    <rect x="449" y="128" width="14" height="14" rx="2" fill="#0088ff" />
    <rect x="411" y="126" width="17" height="17" rx="2" fill="#0066cc" />
    <rect x="424" y="149" width="16" height="16" rx="2" fill="#005ce6" />
    <rect x="441" y="167" width="11" height="11" rx="1.5" fill="#0080ff" />
    <rect x="415" y="176" width="11" height="11" rx="1.5" fill="#004db3" />
  </g>

  <!-- 4. Letra "S" Central y Órbita (Primer Plano) -->
  <g id="main-logo-s">
    <!-- Sombra base inferior -->
    <path d="M 162 248 C 230 245 310 242 342 232 L 325 224 C 280 235 215 240 162 248 Z" fill="#001d57" />

    <!-- Tramo superior de la "S" -->
    <path d="M 376 28 L 222 30 C 165 31 142 68 152 110 C 156 126 168 142 186 155 L 236 155 C 204 134 190 105 196 84 C 201 68 216 64 242 64 L 332 64 Z" fill="url(#gradTopS)" />
    
    <!-- Pliegue oscuro interno izquierdo -->
    <path d="M 152 108 C 156 127 170 144 192 158 L 245 158 C 212 138 193 114 195 86 C 176 88 158 95 152 108 Z" fill="url(#gradDarkBlue)" />

    <!-- Diagonal central de la "S" -->
    <path d="M 218 110 L 326 110 C 362 110 385 130 388 162 C 392 204 358 238 292 242 L 185 245 L 222 213 L 302 211 C 335 210 350 192 346 168 C 343 148 326 141 298 141 L 246 141 Z" fill="url(#gradCyanBlue)" />

    <!-- Brillo superior en la diagonal central -->
    <path d="M 218 110 L 326 110 C 348 110 366 118 377 132 C 360 123 338 121 312 121 L 228 121 Z" fill="#66f7ff" opacity="0.7" />

    <!-- Detalle geométrico interno inferior izquierdo -->
    <path d="M 205 174 L 282 174 L 254 198 L 176 198 Z" fill="url(#gradCyanBlue)" />

    <!-- Órbita / Swoosh envolvente -->
    <path d="M 358 58 C 415 48 446 66 436 105 C 425 148 360 202 268 229 C 175 256 96 252 97 224 C 98 202 135 178 188 162 L 195 166 C 148 183 122 203 124 218 C 127 237 195 236 276 208 C 356 180 412 128 416 92 C 419 67 396 56 358 58 Z" fill="url(#gradTopS)" />
  </g>
</svg>